<!-- Document settings-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">Benjamin Šťastný</div>
        <button class="menu-btn" onclick="toggleMenu()" aria-label="Toggle Menu">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </header>
    
    <!-- Hero content order -->
<main class="hero-section">
    <div class="hero-intro">
        <p class="subtitle">Who am I?</p>
        <h1 class="main-title">
            I am a photographer, musician, student and computer enthusiast.<br>
        </h1>
    </div>

</main>
    <script>
        function toggleMenu() {
            const menuBtn = document.querySelector('.menu-btn');
            const overlayMenu = document.getElementById('overlayMenu');
            
            // Toggle the 'active' class on both the button and the menu
            menuBtn.classList.toggle('active');
            overlayMenu.classList.toggle('active');
        }
    </script>
</body>
</html>
